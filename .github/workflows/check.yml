name: Check and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/api.test.cjs
      - run: node tests/qwen-translate.cjs
      - run: node tests/stream.cjs
      - run: node tests/engbetter-connection.cjs
      - run: python tools/package.py
      - run: python tools/build-site.py
      - uses: actions/upload-artifact@v4
        with:
          name: bandu-extension
          path: dist/*.zip
